# GoReleaser configuration for Novel-TUI
# Documentation at https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: novel-tui
    main: ./cmd/novel-tui
    binary: novel-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

nfpms:
  - id: packages
    package_name: novel-tui
    vendor: SalvucciFacundo
    homepage: https://github.com/SalvucciFacundo/novel-tui
    maintainer: Facundo Salvucci <facundo@salvucci.dev>
    description: Terminal text editor and writing suite for light novels (TUI) in Go
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/local/bin

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "merge conflict"
      - Merge pull request
